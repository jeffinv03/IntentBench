name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite must pass with no credentials configured. Nothing here sets one.
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The parser is pure Python and works against committed fixtures, so
        # contributors without a Mac can work on everything but capturing new ones.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test
        run: pytest -q

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: ruff format
        run: ruff format --check src tests

      - name: ruff check
        run: ruff check src tests

      - name: mypy
        run: mypy

  smoke:
    name: cli smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Every command works end to end, with no API key
        run: |
          set -euxo pipefail
          intentbench --version
          intentbench catalog tests/fixtures/catalogs/weather.actionsdata
          intentbench catalog tests/fixtures/catalogs/synthetic.actionsdata --json > /dev/null
          intentbench catalog tests/fixtures/catalogs/synthetic.actionsdata --dump-raw AddItemIntent > /dev/null
          intentbench validate \
            --app examples/weather-app/weather.actionsdata \
            --corpus examples/weather-app/phrases.yaml
          intentbench run \
            --app examples/weather-app/weather.actionsdata \
            --corpus examples/weather-app/phrases.yaml \
            --judge mock --mock-script examples/weather-app/mock-responses.yaml \
            --threshold 0 --json /tmp/results.json --markdown /tmp/summary.md
          intentbench diff /tmp/results.json /tmp/results.json

  build:
    name: build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
